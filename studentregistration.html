<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Management System</h1>
        <p>Student Registration Module</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="studentregistration.html">Registration</a>
        <a href="studentreport.html">Student Report</a>
    </nav>

    <main>
        <h2>Student Registration</h2>
        <p>Register new students by entering their details below.</p>

        <form>
            <label>Student Name:</label>
            <input type="text" placeholder="Enter student name">

            <label>Student ID:</label>
            <input type="text" placeholder="Enter student ID">

            <label>Email:</label>
            <input type="email" placeholder="Enter email">

            <label>Course:</label>
            <input type="text" placeholder="Enter course">

            <button type="submit">Register</button>
        </form>

        <p>Student Registration Module</p>
    </main>

    <footer>
        <p>Student Management System</p>
    </footer>

</body>
</html>
